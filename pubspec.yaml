name: bookify_audio
description: "Bookify Audio"

version: 1.0.1+2

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  youtube_explode_dart: ^2.3.6
  flutter_riverpod: ^2.6.1
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  path_provider: ^2.1.5
  icons_launcher: ^3.0.3
  flutter_foreground_task: ^9.2.0
  youtube_player_flutter: ^9.1.3
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.13

icons_launcher:
  image_path: "assets/app_icon.png"
  platforms:
    android:
      enable: true
    ios:
      enable: true

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/app_icon.png
    - assets/splash.png
    - assets/data/library_bn.json
    - assets/data/library_en.json
    - CHANGELOG.md

